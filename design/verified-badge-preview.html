<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KISY — значок верификации: раунд 2</title>
<style>
  :root { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: #1a1a22; color: #eee; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lead { color: #aaa; margin: 0 0 24px; max-width: 780px; line-height: 1.5; }
  .variant { margin: 0 0 40px; }
  .variant h2 { font-size: 18px; margin: 0 0 4px; }
  .variant p { color: #aaa; margin: 0 0 14px; max-width: 780px; line-height: 1.5; font-size: 14px; }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .theme { background: var(--bg); color: var(--ink); border-radius: 14px; padding: 14px; border: 1px solid var(--divider); }
  .theme small { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .big { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
  .row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  .name20 { font-size: 17px; font-weight: 650; }
  .name14 { font-size: 13px; font-weight: 600; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--divider); flex: none; }
  svg { display: inline-block; flex: none; }
  [data-t=orbit]  { --bg:#0b0c14; --ink:#f2f2f7; --dim:#9a9aae; --divider:rgba(255,255,255,.12); --acc:#7c5cff; --acc-on:#fff; }
  [data-t=glass]  { --bg:#e9e6f6; --ink:#1d1d1f; --dim:#6b6b78; --divider:rgba(0,0,0,.08); --acc:#5e5ce6; --acc-on:#fff; }
  [data-t=aurora] { --bg:#efe7fb; --ink:#2c1f42; --dim:#7c6f92; --divider:rgba(90,50,110,.12); --acc:#c8269e; --acc-on:#fff; }
  [data-t=cyber]  { --bg:#150a34; --ink:#f5fbff; --dim:#a6c4e8; --divider:rgba(0,245,255,.25); --acc:#00f5ff; --acc-on:#03121a; }
  [data-t=xp]     { --bg:#c0c0c0; --ink:#000; --dim:#404040; --divider:#808080; --acc:#000080; --acc-on:#fff; }
  [data-t=matrix] { --bg:#000600; --ink:#39ff5a; --dim:#1f9a37; --divider:rgba(0,255,65,.25); --acc:#00ff41; --acc-on:#001b06; }
</style>
</head>
<body>
<h1>Значок верификации — раунд 2: ромб, щит, печать</h1>
<p class="lead">Геометрия от варианта B, знак внутри — чистая галочка без «каракули». У вариантов с двойным ободком внутреннее
кольцо рисуется только от 20 px: на 14 px оно слилось бы, поэтому маленький размер — упрощённый силуэт той же формы. Цвета — токены темы.</p>

<script>
  // Each variant: body path, optional inner ring (only drawn at >= 20px), check path.
  const CHECK = "m8 12.3 2.8 2.8 5.2-5.6";
  const V = {
    D1: {
      title: "D1. Ромб",
      text: "Мягкий ромб из варианта B с простой галочкой. Самая лаконичная форма: ни одна крупная платформа ромб не использует, и он держит силуэт на 14 px.",
      body: "M12 1.2c.8 0 1.5.3 2.1.9l7.8 7.8a3 3 0 0 1 0 4.2l-7.8 7.8a3 3 0 0 1-4.2 0l-7.8-7.8a3 3 0 0 1 0-4.2l7.8-7.8c.6-.6 1.3-.9 2.1-.9Z",
      check: "m8.2 12.1 2.6 2.6 5-5.2",
    },
    D2: {
      title: "D2. Ромб-печать",
      text: "Тот же ромб, но как оттиск печати: тонкий внутренний ободок повторяет контур. Ромб B плюс ощущение «штампа», знака, который ставят, а не рисуют.",
      body: "M12 1.2c.8 0 1.5.3 2.1.9l7.8 7.8a3 3 0 0 1 0 4.2l-7.8 7.8a3 3 0 0 1-4.2 0l-7.8-7.8a3 3 0 0 1 0-4.2l7.8-7.8c.6-.6 1.3-.9 2.1-.9Z",
      ring: "M12 4.3c.4 0 .7.1 1 .4l6.3 6.3c.6.6.6 1.4 0 2l-6.3 6.3c-.6.6-1.4.6-2 0L4.7 13c-.6-.6-.6-1.4 0-2L11 4.7c.3-.3.6-.4 1-.4Z",
      check: "m8.8 12.1 2.2 2.2 4.2-4.4",
    },
    S1: {
      title: "S1. Щит",
      text: "Геральдический щит: прямые плечи со скруглёнными углами, мягкое остриё снизу. Классический знак доверия, но своей формы — не значок антивируса и не розетка соцсети.",
      body: "M5 2.6h14c1.1 0 2 .9 2 2V11c0 5.2-3.6 9.3-8.4 10.9-.4.1-.8.1-1.2 0C6.6 20.3 3 16.2 3 11V4.6c0-1.1.9-2 2-2Z",
      check: "m7.9 11.4 2.8 2.8 5.4-5.6",
    },
    S2: {
      title: "S2. Щит-печать",
      text: "Щит S1 с внутренним ободком — как тиснение на гербовой печати. Торжественнее S1; на 14 px превращается в обычный щит.",
      body: "M5 2.6h14c1.1 0 2 .9 2 2V11c0 5.2-3.6 9.3-8.4 10.9-.4.1-.8.1-1.2 0C6.6 20.3 3 16.2 3 11V4.6c0-1.1.9-2 2-2Z",
      ring: "M6.4 4.9h11.2c.4 0 .7.3.7.7V11c0 3.9-2.6 7-6.3 8.4-3.7-1.4-6.3-4.5-6.3-8.4V5.6c0-.4.3-.7.7-.7Z",
      check: "m8.8 11.3 2.3 2.3 4.4-4.6",
    },
    P1: {
      title: "P1. Печать-восьмиугольник",
      text: "Восьмигранная печать с мягкими гранями — между ромбом B и медалью. Грани, а не зубцы: не путается с розеткой X/Instagram, но сразу читается как «официальный знак».",
      body: "M8.9 1.8h6.2c.8 0 1.6.3 2.1.9l4.1 4.1c.6.6.9 1.3.9 2.1v6.2c0 .8-.3 1.6-.9 2.1l-4.1 4.1c-.6.6-1.3.9-2.1.9H8.9c-.8 0-1.6-.3-2.1-.9l-4.1-4.1c-.6-.6-.9-1.3-.9-2.1V8.9c0-.8.3-1.6.9-2.1l4.1-4.1c.6-.6 1.3-.9 2.1-.9Z",
      ring: "M9.6 4.3h4.8c.5 0 .9.2 1.3.5l3.5 3.5c.3.4.5.8.5 1.3v4.8c0 .5-.2.9-.5 1.3l-3.5 3.5c-.4.3-.8.5-1.3.5H9.6c-.5 0-.9-.2-1.3-.5l-3.5-3.5c-.3-.4-.5-.8-.5-1.3V9.6c0-.5.2-.9.5-1.3l3.5-3.5c.4-.3.8-.5 1.3-.5Z",
      check: "m8.6 12.1 2.4 2.4 4.6-4.8",
    },
  };

  const themes = [["orbit", "Орбита"], ["glass", "Стекло"], ["aurora", "Aurora"], ["cyber", "Cyber"], ["xp", "Windows 95"], ["matrix", "Matrix"]];

  function badge(v, size) {
    const d = V[v];
    const detailed = size >= 20 && d.ring;
    const ring = detailed
      ? `<path fill="none" stroke="var(--acc-on)" stroke-opacity=".55" stroke-width="1" d="${d.ring}"/>`
      : "";
    const check = detailed ? d.check : (d.ring ? CHECK : d.check);
    const sw = size <= 14 ? 2.8 : detailed ? 2.1 : 2.4;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="var(--acc)" d="${d.body}"/>${ring}
      <path fill="none" stroke="var(--acc-on)" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" d="${check}"/>
    </svg>`;
  }

  document.body.insertAdjacentHTML("beforeend", Object.keys(V).map((v) => `
    <section class="variant">
      <h2>${V[v].title}</h2>
      <p>${V[v].text}</p>
      <div class="themes">${themes.map(([key, label]) => `
        <div class="theme" data-t="${key}">
          <small>${label}</small>
          <div class="big">${badge(v, 64)}${badge(v, 20)}${badge(v, 14)}</div>
          <div class="row"><span class="name20">Анна Смирнова</span>${badge(v, 20)}</div>
          <div class="row"><span class="avatar"></span><span class="name14">Горный клуб</span>${badge(v, 14)}</div>
        </div>`).join("")}</div>
    </section>`).join(""));
</script>
</body>
</html>
