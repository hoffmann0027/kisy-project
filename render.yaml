# Render Blueprint — deploys the web service (backend + SPA) in Frankfurt.
# In the Render dashboard: New → Blueprint → connect this repo. Render reads
# this file, creates the service and prompts for the sync:false secrets below.
#
# Data lives on EXTERNAL, non-expiring free services (Render's own free
# Postgres/Redis are deleted after 30 days — that is why they are not used
# here): PostgreSQL on Neon, Redis on Upstash, both in an EU region next to
# this service. You paste their connection strings into DATABASE_URL /
# REDIS_URL (and BOOTSTRAP_CEO_PASSWORD) in the dashboard on first deploy.
# See docs/deploy-render.md.

services:
  - type: web
    name: kisy
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: LOG_LEVEL
        value: info
      # Public origin of this single-service deploy. The backend serves the SPA
      # same-origin, so this pins the WebSocket/CSRF allowlist (belt-and-braces
      # on top of the same-host fallback). Update it if you attach a custom
      # domain.
      - key: WS_ALLOWED_ORIGIN
        value: https://kisy.onrender.com
      # Secrets generated by Render (long, random) — never committed.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # External data stores — paste the connection strings in the dashboard.
      # DATABASE_URL: Neon (postgresql://…?sslmode=require, DIRECT/non-pooled
      # endpoint — pgx keeps a long-lived pool and prepared statements, which
      # Neon's pgbouncer pooler breaks). REDIS_URL: Upstash (rediss://…).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # First CEO account, created when the users table is empty.
      - key: BOOTSTRAP_CEO_USERNAME
        value: ceo
      - key: BOOTSTRAP_CEO_PASSWORD
        sync: false # set this yourself in the dashboard on first deploy
      # Voice calls (WebRTC): public STUN lets most calls connect. Render's
      # free tier can't host coturn (no UDP), so for calls across strict/
      # symmetric NATs add a managed TURN service and set TURN_URLS / TURN_SECRET
      # in the dashboard. See docs/deploy-render.md.
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
