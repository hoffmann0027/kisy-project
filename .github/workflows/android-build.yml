# Builds the Android app from the existing SPA bundle (Capacitor shell) and
# publishes the APK as a downloadable artifact — no local JDK or Android SDK
# needed, GitHub's runners already ship both.
#
# The debug APK is for testers (install it directly). It is signed with the
# same app key as the release, so each new build installs over the previous
# one and keeps the app's data, E2EE keys included. The Play bundle is the
# "Android release" workflow. Signing setup: docs/android.md.
name: Android build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Every build is signed with the one app key. Without it the build stops:
      # an APK signed with the runner's random debug key cannot be installed
      # over the app already on a phone, and reinstalling wipes its E2EE keys.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_B64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$CERT_SHA256" ] || missing="$missing ANDROID_SIGNING_CERT_SHA256(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing configuration:$missing — run scripts/android-signing-setup.ps1 (docs/android.md)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        env:
          # Baked into the bundle: the native app is cross-origin, so it needs
          # the absolute API origin (relative paths would hit the WebView).
          VITE_NATIVE_API_ORIGIN: ${{ vars.NATIVE_API_ORIGIN || 'https://kisy.onrender.com' }}
        run: npm run build

      # Optional: without it the app still works, it just cannot receive push
      # notifications (see docs/android.md).
      - name: Add the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not set — this build cannot receive push notifications"
            exit 0
          fi
          # Both failures below mean the secret holds something other than the
          # base64 of google-services.json — say so, rather than leaving the
          # reader with "base64: invalid input".
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json || {
            echo "::error::GOOGLE_SERVICES_JSON is not valid base64 — re-encode google-services.json and update the secret (docs/android.md)" >&2
            exit 1
          }
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" || {
            echo "::error::GOOGLE_SERVICES_JSON decoded to something that is not the google-services.json file (docs/android.md)" >&2
            exit 1
          }

      - name: Sync the bundle into the Android project
        run: npx cap sync android

      # The native call rules (earpiece/loudspeaker/headset routing and the
      # proximity lock being released when a call ends) are plain JUnit tests.
      # They run before the APK is built, so a broken rule never ships.
      - name: Unpack the signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kisy-signing.jks"
          # Minutes since the epoch: grows with every build of either workflow,
          # so a newer APK always installs over an older one.
          echo "KISY_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Native unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: frontend/android

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: frontend/android
        env:
          KISY_KEYSTORE_FILE: ${{ runner.temp }}/kisy-signing.jks
          KISY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KISY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KISY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KISY_VERSION_NAME: dev-${{ github.sha }}

      # The pinned fingerprint catches a secret that was replaced by another key:
      # such a build would install on no phone that has the app.
      - name: Verify the signature is the app key
        working-directory: frontend/android
        env:
          CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for apk in app/build/outputs/apk/debug/*.apk; do
            got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
            want=$(printf '%s' "$CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$got" != "$want" ]; then
              echo "::error::$apk is signed with $got, expected the app key $want" >&2
              exit 1
            fi
            echo "$apk signed with the app key ($got)"
          done

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/kisy-signing.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: kisy-android-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
