# Builds the Android app from the existing SPA bundle (Capacitor shell) and
# publishes the APK as a downloadable artifact — no local JDK or Android SDK
# needed, GitHub's runners already ship both.
#
# The debug APK is for testing on your own phone (install it directly).
# A signed release build for Google Play is a separate step: it needs the
# upload keystore, which must never live in the repository.
name: Android build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        env:
          # Baked into the bundle: the native app is cross-origin, so it needs
          # the absolute API origin (relative paths would hit the WebView).
          VITE_NATIVE_API_ORIGIN: ${{ vars.NATIVE_API_ORIGIN || 'https://kisy.onrender.com' }}
        run: npm run build

      - name: Sync the bundle into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: frontend/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kisy-android-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
