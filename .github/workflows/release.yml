name: Release

# Builds and publishes versioned container images on a semver tag. Deployment
# is not part of it: production is Render, which deploys from main by itself
# (see the note at the end of this file).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# No deploy job on purpose.
#
# Production is Render: it builds from ./Dockerfile and deploys itself on every
# push to main (render.yaml, autoDeploy: true). There is no staging host and no
# SSH target — the two deploy jobs that used to live here pointed at
# staging.kisy.example and kisy.example, hosts that never existed, and the first
# tag pushed would have failed on them (audit C-13).
#
# What this workflow is for: publishing versioned, immutable images to GHCR so a
# self-hosted compose deployment can pin a version, and so a release has
# artifacts to point at. Rolling back such a deployment means setting
# KISY_VERSION to the previous tag and `docker compose ... up -d`.
#
# Rolling back Render means redeploying an earlier commit from its dashboard
# (Manual Deploy → pick a commit) — see docs/devops.md.
