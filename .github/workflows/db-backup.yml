# Scheduled off-site backup of the production Postgres (Neon) with an automatic
# restore-drill. Runs on GitHub's infrastructure — no always-on server needed —
# and, because the drill fails the workflow on a bad backup, GitHub emails the
# repo owner (free alerting). See docs/runbook.md.
#
# Required repository secrets:
#   DATABASE_URL            Neon DIRECT connection string (…?sslmode=require)
#   BACKUP_GPG_PASSPHRASE   the dump is encrypted (AES-256) before it touches
#                           disk; without it the workflow refuses to run
# Storage (required while the repository is public):
#   S3_BUCKET, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#                           a PRIVATE bucket (Cloudflare R2 / Backblaze B2 / S3)
#
# Why not an Actions artifact: artifacts of a public repository can be
# downloaded by any signed-in GitHub user. Even encrypted, a copy of every
# user's data does not belong there (audit A-08). An artifact is uploaded only
# when the repository is private.
name: DB backup

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
      REQUIRE_ENCRYPTION: "1"
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          test -n "$BACKUP_GPG_PASSPHRASE" || { echo "::error::BACKUP_GPG_PASSPHRASE secret is not set — backups are never stored unencrypted"; exit 1; }

      - name: Dump the database (encrypted stream, Postgres 18 client)
        run: bash scripts/db-backup.sh backups

      # Restore-drill: prove the backup we just took decrypts, restores into an
      # empty Postgres with the same restore script an operator would use, and
      # that the schema is intact. A broken backup fails here → email.
      - name: Restore-drill into a throwaway Postgres 18
        run: |
          docker network create drill >/dev/null
          docker run -d --name verifydb --network drill -e POSTGRES_PASSWORD=pw postgres:18-alpine >/dev/null
          # The postgres image runs a temporary unix-socket-only server while it
          # initialises; only the FINAL server listens on TCP. Poll over TCP.
          ready=""
          for _ in $(seq 1 60); do
            if docker exec verifydb pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          test -n "$ready" || { echo "::error::verify Postgres never became ready"; docker logs verifydb; exit 1; }

          files=(backups/kisy-*.sql.gz.gpg); file="${files[0]}"
          test -f "$file" || { echo "::error::no encrypted backup produced"; ls -la backups; exit 1; }
          DOCKER_RUN_ARGS="--network drill" \
            TARGET_DATABASE_URL="postgres://postgres:pw@verifydb:5432/postgres" \
            timeout 600 bash scripts/db-restore.sh "$file"
          timeout 60 docker exec -i verifydb psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/backup-smoke-check.sql
          echo "restore-drill passed"

      - name: Copy to private object storage
        if: ${{ env.S3_BUCKET != '' }}
        run: |
          files=(backups/kisy-*.sql.gz.gpg); file="${files[0]}"
          dest="s3://$S3_BUCKET/$(basename "$file")"
          if [ -n "$S3_ENDPOINT" ]; then
            aws s3 cp "$file" "$dest" --endpoint-url "$S3_ENDPOINT"
          else
            aws s3 cp "$file" "$dest"
          fi
          echo "uploaded $(basename "$file") to s3://$S3_BUCKET"

      - name: Upload backup artifact (private repositories only)
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@v5
        with:
          name: db-backup
          path: backups/kisy-*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Fail if the backup was stored nowhere
        if: ${{ env.S3_BUCKET == '' && github.event.repository.private != true }}
        run: |
          echo "::error::The backup was taken and verified but NOT stored: this repository is public, so it is not uploaded as an artifact. Configure S3_BUCKET (+ S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY) for a private bucket."
          exit 1
