# Builds a SIGNED release of the Android app: an .aab to upload to Google Play
# and an .apk for direct installation.
#
# Prerequisites, all stored as repository secrets (see docs/android.md):
#   ANDROID_KEYSTORE_B64       — the app signing keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  — its store password
#   ANDROID_KEY_ALIAS          — the key alias inside the keystore
#   ANDROID_KEY_PASSWORD       — the key password (optional if same as store)
#   ANDROID_SIGNING_CERT_SHA256 (variable) — the key's pinned fingerprint
#   GOOGLE_SERVICES_JSON       — Firebase config, base64 (optional; no push without it)
# scripts/android-signing-setup.ps1 creates the key and sets the signing ones.
#
# The keystore is the app's identity on Play: lose it and the listing can never
# be updated again. Back it up outside GitHub as well.
name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Every build is signed with the one app key. Without it the build stops:
      # an APK signed with the runner's random debug key cannot be installed
      # over the app already on a phone, and reinstalling wipes its E2EE keys.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_B64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$CERT_SHA256" ] || missing="$missing ANDROID_SIGNING_CERT_SHA256(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing configuration:$missing — run scripts/android-signing-setup.ps1 (docs/android.md)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        env:
          # Baked into the bundle: the native app is cross-origin, so it needs
          # the absolute API origin (relative paths would hit the WebView).
          VITE_NATIVE_API_ORIGIN: ${{ vars.NATIVE_API_ORIGIN || 'https://kisy.onrender.com' }}
        run: npm run build

      - name: Add the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not set — this build cannot receive push notifications"
            exit 0
          fi
          # Fail loudly, and legibly, rather than shipping a mangled config.
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json || {
            echo "::error::GOOGLE_SERVICES_JSON is not valid base64 — re-encode google-services.json and update the secret (docs/android.md)" >&2
            exit 1
          }
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" || {
            echo "::error::GOOGLE_SERVICES_JSON decoded to something that is not the google-services.json file (docs/android.md)" >&2
            exit 1
          }

      - name: Sync the bundle into the Android project
        run: npx cap sync android

      - name: Unpack the signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kisy-signing.jks"
          # Minutes since the epoch: grows with every build of either workflow,
          # so a newer APK always installs over an older one.
          echo "KISY_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Build the signed bundle and APK
        working-directory: frontend/android
        env:
          KISY_KEYSTORE_FILE: ${{ runner.temp }}/kisy-signing.jks
          KISY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KISY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KISY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KISY_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Verify the bundle is signed
        working-directory: frontend/android
        run: |
          # An unsigned bundle would carry no META-INF signature block.
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC' \
            || { echo "::error::the .aab is not signed" >&2; exit 1; }

      # The pinned fingerprint catches a secret that was replaced by another key:
      # such a build would install on no phone that has the app.
      - name: Verify the signature is the app key
        working-directory: frontend/android
        env:
          CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -o pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo "apksigner: $apksigner"
          want=$(printf '%s' "$CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          for apk in app/build/outputs/apk/release/app-release.apk; do
            # The whole report goes to the log: a certificate digest is public,
            # and without it a mismatch cannot be diagnosed.
            report=$("$apksigner" verify --verbose --print-certs "$apk")
            echo "$report"
            got=$(echo "$report" | sed -n 's/^Signer.*certificate SHA-256 digest: *//p' | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)
            if [ -z "$got" ]; then
              echo "::error::no signer certificate digest found in the apksigner report for $apk" >&2
              exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::$apk is signed with $got, expected the app key $want" >&2
              exit 1
            fi
            echo "$apk signed with the app key ($got)"
          done

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/kisy-signing.jks"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kisy-android-release-${{ inputs.version_name }}
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
