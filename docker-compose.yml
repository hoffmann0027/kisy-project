name: kisy

# Container logs are capped so they cannot quietly fill the disk — a full disk
# takes Postgres (and with it the whole site) down, which is exactly the
# failure mode the LowDisk alert in docs/runbook.md watches for. 30 MB per
# service is plenty for debugging a recent incident.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kisy-net

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds only reconstructible state: presence counters, the WebSocket
    # fan-out channels, in-flight call state and rate-limit counters. Nothing
    # here is a source of truth — that is Postgres — so persistence is switched
    # OFF deliberately (`--save ""`, appendonly no): a restart simply starts
    # empty, clients reconnect and presence re-registers, which is preferable
    # to reloading a stale snapshot of who was online an hour ago.
    #
    # maxmemory must be set explicitly: without it Redis ignores the container
    # limit and gets OOM-killed instead of evicting. allkeys-lru degrades
    # gracefully under pressure (every key is rebuildable); noeviction would
    # make Redis start refusing writes, breaking presence and calls outright.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kisy-net

  backend:
    logging: *default-logging
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      BACKEND_HTTP_PORT: ${BACKEND_HTTP_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      # Connection-pool tuning (see .env.example); unset falls back to the
      # defaults in internal/config.
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-}
      DB_POOL_MIN_CONNS: ${DB_POOL_MIN_CONNS:-}
      DB_POOL_MAX_CONN_LIFETIME: ${DB_POOL_MAX_CONN_LIFETIME:-}
      DB_POOL_MAX_CONN_IDLE_TIME: ${DB_POOL_MAX_CONN_IDLE_TIME:-}
      DB_POOL_HEALTHCHECK_PERIOD: ${DB_POOL_HEALTHCHECK_PERIOD:-}
      # Object storage for uploaded bytes (O5). Empty endpoint/bucket keeps
      # files in Postgres; point it at the minio service below to switch.
      BLOB_S3_ENDPOINT: ${BLOB_S3_ENDPOINT:-}
      BLOB_S3_BUCKET: ${BLOB_S3_BUCKET:-}
      BLOB_S3_ACCESS_KEY: ${BLOB_S3_ACCESS_KEY:-}
      BLOB_S3_SECRET_KEY: ${BLOB_S3_SECRET_KEY:-}
      BLOB_S3_REGION: ${BLOB_S3_REGION:-}
      BLOB_S3_USE_SSL: ${BLOB_S3_USE_SSL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      INVITATION_TOKEN_TTL: ${INVITATION_TOKEN_TTL}
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      WS_ALLOWED_ORIGIN: ${WS_ALLOWED_ORIGIN:-}
      BOOTSTRAP_CEO_USERNAME: ${BOOTSTRAP_CEO_USERNAME:-}
      BOOTSTRAP_CEO_PASSWORD: ${BOOTSTRAP_CEO_PASSWORD:-}
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-kisy}
      TURN_TTL: ${TURN_TTL:-12h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kisy-net

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kisy-net

  coturn:
    logging: *default-logging
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    # The shared secret and realm are injected here so they stay out of the
    # committed turnserver.conf. Media (TURN relay) bypasses Nginx entirely.
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET}", "--realm=${TURN_REALM:-kisy}"]
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    networks:
      - kisy-net

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - kisy-net

networks:
  kisy-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
