apply plugin: 'com.android.application'

// Release identity and signing come from the environment, never from the
// repository. The keystore is a base64 secret the workflow materialises into a
// file, and it signs BOTH variants: Android installs an update only over an
// app signed with the same key, and a debug build left on the default debug
// key — a fresh random one on every CI runner — could never be updated in
// place. Every update became uninstall-and-reinstall, which wipes the
// device's E2EE keys. With no keystore set (a local build) the debug variant
// uses the machine's own debug key and the release variant assembles
// unsigned; neither is for distribution.
def releaseKeystore = System.getenv("KISY_KEYSTORE_FILE")
def appVersionCode = (System.getenv("KISY_VERSION_CODE") ?: "1") as Integer
def appVersionName = System.getenv("KISY_VERSION_NAME") ?: "1.0"

android {
    namespace = "com.kisy.messenger"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kisy.messenger"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("KISY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("KISY_KEY_ALIAS")
                // Most keystores use one password for the store and the key;
                // fall back so only one secret is mandatory.
                keyPassword System.getenv("KISY_KEY_PASSWORD") ?: System.getenv("KISY_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The call code in com.kisy.messenger.calls builds its own notification and
    // extends the push plugin's Firebase service. The plugin pulls both in, but
    // as `implementation`, so they are not on this module's compile classpath —
    // same pinned versions, declared here too.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
