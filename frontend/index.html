<!doctype html>
<html lang="ru" data-theme="orbit">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page extend into the notch/home-indicator
         area — and is what makes env(safe-area-inset-*) report real values
         instead of 0 (see --safe-* in theme.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Persisted theme before first paint (see the file for why it is one). -->
    <script src="/theme-init.js"></script>
    <meta name="description" content="KISY — корпоративный мессенджер" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KISY" />
    <title>KISY</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
