# TLS 1.3 terminating edge for production (docs/spec/06-security.md:
# "TLS 1.3 only. HSTS. Perfect Forward Secrecy."). Mount certificates at
# /etc/nginx/certs/{fullchain.pem,privkey.pem} and enable via
# docker-compose.prod.yml. Generate dev certs with scripts/gen-dev-certs.sh.

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# The native app authenticates the WebSocket handshake with
# ?access_token=<jwt> — a browser cannot set headers on an upgrade, so the
# credential has to ride in the URL. The default log format writes $request
# verbatim, which would park a live token in the access log (and in every
# log shipper downstream). This format logs the path and drops the query.
log_format ws_noquery '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent"';

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript
    application/x-javascript text/xml application/xml image/svg+xml;

upstream frontend_upstream {
    server frontend:8080;
}

# Backend replicas are resolved per request so a replaced or stopped instance
# stops receiving traffic without an nginx reload — see the note in
# nginx.conf. 127.0.0.11 is Docker's embedded DNS.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Re-resolved per request thanks to the variable (see the resolver note).
    set $backend_pool "backend:8080";

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.3 only; PFS is inherent to the TLS 1.3 cipher suites.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    proxy_hide_header X-Powered-By;

    # Identity headers arriving from the client are untrusted. chi RealIP
    # reads True-Client-IP BEFORE X-Real-IP, so an unstripped header lets a
    # caller forge its own IP: every per-IP rate limit (login, register,
    # refresh, link-preview, calls) is bypassed by varying it, and the IP
    # hash stored in sessions and the audit log becomes attacker-chosen.
    # X-Forwarded-For is therefore OVERWRITTEN with $remote_addr, not
    # appended to. nginx only inherits proxy_set_header into a location that
    # declares none of its own, so both lines are repeated per location.

    # Retry a sibling replica when a peer is unreachable (see nginx.conf).
    # No `non_idempotent`, so writes are never replayed.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;

    # HSTS on every response (two years, preload-eligible).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://$backend_pool;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://$backend_pool;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        access_log /var/log/nginx/access.log ws_noquery;
        proxy_pass http://$backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location /health {
        access_log off;
        proxy_pass http://$backend_pool;
        proxy_set_header Host $http_host;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $http_host;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
