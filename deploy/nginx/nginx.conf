# Edge reverse proxy: single entrypoint routing to the frontend static
# bundle and the backend API/WebSocket, hardened per docs/spec/06-security.md.
# Plain HTTP here; the TLS 1.3 terminating variant is deploy/nginx/nginx.tls.conf,
# enabled in production via docker-compose.prod.yml.

# --- rate limiting (per client IP) ---
# Auth endpoints are the brute-force surface and are limited tightly;
# general API traffic gets a looser ceiling. The backend also enforces
# per-IP limits in Redis (defense in depth across instances).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# The native app authenticates the WebSocket handshake with
# ?access_token=<jwt> — a browser cannot set headers on an upgrade, so the
# credential has to ride in the URL. The default log format writes $request
# verbatim, which would park a live token in the access log (and in every
# log shipper downstream). This format logs the path and drops the query.
log_format ws_noquery '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent"';

# Hide nginx version in error pages and the Server header.
server_tokens off;

# gzip for text assets.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript
    application/x-javascript text/xml application/xml image/svg+xml;

upstream frontend_upstream {
    server frontend:8080;
}

# Backend replicas are resolved at REQUEST time, not once at startup: with
# `docker compose up --scale backend=N` the service name resolves to every
# replica's address, and Docker's embedded resolver drops an instance as soon
# as it stops. A classic `upstream { server backend:8080; }` block would pin
# the addresses it saw at boot, so a replaced container (rolling deploy) or a
# rescheduled one would keep getting traffic at a dead IP until nginx reloads.
# 127.0.0.11 is Docker's built-in DNS; the short TTL bounds how long a stopped
# replica can still be handed requests.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

server {
    listen 80;
    server_name _;

    # Re-resolved per request thanks to the variable (see the resolver note).
    set $backend_pool "backend:8080";

    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Do not leak upstream identifying headers.
    proxy_hide_header X-Powered-By;

    # Identity headers arriving from the client are untrusted. chi RealIP
    # reads True-Client-IP BEFORE X-Real-IP, so an unstripped header lets a
    # caller forge its own IP: every per-IP rate limit (login, register,
    # refresh, link-preview, calls) is bypassed by varying it, and the IP
    # hash stored in sessions and the audit log becomes attacker-chosen.
    # X-Forwarded-For is therefore OVERWRITTEN with $remote_addr, not
    # appended to. nginx only inherits proxy_set_header into a location that
    # declares none of its own, so both lines are repeated per location.

    # Failover between replicas. Right after an instance dies its address can
    # still be in the resolver cache, so the first request may pick a dead
    # peer; retrying against a sibling turns that into a slightly slower
    # response instead of an error. Note this deliberately does NOT include
    # `non_idempotent`: nginx retries POST/PATCH only when the request was
    # never sent, so a message can never be delivered twice.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://$backend_pool;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://$backend_pool;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        access_log /var/log/nginx/access.log ws_noquery;
        proxy_pass http://$backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /health {
        access_log off;
        proxy_pass http://$backend_pool;
        proxy_set_header Host $http_host;
        # Untrusted client identity headers — see the note above.
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Frontend static bundle. Security headers are applied here (the
    # backend sets its own on /api, /ws and /health responses, so adding
    # them again would duplicate).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $http_host;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
