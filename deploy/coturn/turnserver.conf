# coturn TURN/STUN server for KISY 1:1 audio calls.
#
# The shared secret is NOT stored here — it is passed at launch via
# --static-auth-secret=${TURN_SECRET} (and --realm=${TURN_REALM}) from the
# environment, so no secret is committed to the repo. Clients receive only
# short-lived credentials the backend derives from that secret (TURN REST API),
# which coturn validates because "use-auth-secret" is enabled below.

listening-port=3478

# Time-limited (REST API) credentials: username = "<expiry>:<userId>",
# password = base64(HMAC-SHA1(secret, username)). Matches calls.Service.ICEConfig.
use-auth-secret

# Relay port range (must be published by the container in docker-compose).
min-port=49160
max-port=49200

fingerprint
stale-nonce=600

# Dev/plain deployment: no TLS/DTLS certs. Terminate TLS at the edge in prod.
no-tls
no-dtls

# Lock down: no admin CLI, and never relay to anything that is not the public
# internet. A TURN relay forwards to whatever address the client names, so
# every range the server itself can reach but the internet cannot must be
# listed — the list used to stop at RFC 1918 and loopback, leaving the cloud
# metadata service (169.254.169.254), carrier-grade NAT and all of IPv6 open
# to anyone holding credentials (audit A-30).
no-cli
no-multicast-peers
# IPv4: "this network", RFC 1918, loopback, link-local (cloud metadata),
# carrier-grade NAT, IETF protocol assignments, documentation and benchmark
# ranges, multicast and reserved.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
# IPv6: unspecified and loopback, IPv4-mapped, unique-local, link-local,
# documentation, multicast.
denied-peer-ip=::-::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Calls are UDP audio. A TCP relay is a general-purpose proxy and nothing
# KISY needs, so it is off.
no-tcp-relay

# Bound what one account (and the server as a whole) can hold open: a call
# needs one or two allocations, not hundreds.
user-quota=8
total-quota=200
